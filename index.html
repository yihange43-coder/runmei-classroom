<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空教室查询平台</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: 1.9rem; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.2); margin-bottom: 4px; }
        .header p { font-size: 0.9rem; opacity: 0.85; }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            margin-bottom: 16px;
        }

        /* Upload Section */
        .upload-area {
            border: 3px dashed #c5cae9;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f3f0ff;
        }
        .upload-icon { font-size: 3rem; margin-bottom: 12px; }
        .upload-title { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 6px; }
        .upload-hint { font-size: 0.85rem; color: #999; }
        .upload-formats { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .format-tag {
            background: #e8eaf6; color: #3f51b5;
            padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600;
        }

        /* Processing */
        .processing { text-align: center; padding: 30px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-bar-bg { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; margin: 12px 0; }
        .progress-bar-fill { height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 4px; transition: width 0.3s; }
        .process-status { font-size: 0.85rem; color: #666; }

        /* Data Summary */
        .data-summary {
            display: flex; gap: 20px; flex-wrap: wrap;
            background: #f5f0ff; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
        }
        .summary-item { font-size: 0.85rem; color: #555; }
        .summary-item b { color: #667eea; font-size: 1rem; }

        /* Filters */
        .filter-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; margin-bottom: 14px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.8rem; font-weight: 600; color: #666; }

        select {
            padding: 8px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 0.9rem; outline: none; cursor: pointer; background: white;
            min-width: 160px;
        }
        select:focus { border-color: #667eea; }

        .week-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .week-btn {
            width: 34px; height: 30px; border: 2px solid #e0e0e0; border-radius: 6px;
            background: white; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; color: #555;
        }
        .week-btn:hover { border-color: #667eea; }
        .week-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: transparent; }

        .day-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .day-btn {
            padding: 7px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
            background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; color: #555;
        }
        .day-btn:hover { border-color: #667eea; }
        .day-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: transparent; }

        .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: #666; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
        .dot-free { background: #4caf50; }
        .dot-busy { background: #ff7043; }

        .stats { font-size: 0.88rem; color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; }
        .badge-free { background: #e8f5e9; color: #2e7d32; }
        .badge-busy { background: #fff3e0; color: #e65100; }

        .table-wrapper { overflow-x: auto; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 700px; }
        thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
            padding: 12px 8px; text-align: center; font-weight: 600; position: sticky; top: 0; z-index: 10;
        }
        thead th:first-child { border-top-left-radius: 6px; text-align: left; padding-left: 14px; }
        thead th:last-child { border-top-right-radius: 6px; }
        .section-sub { font-size: 0.7rem; font-weight: 400; opacity: 0.8; display: block; }
        tbody td { padding: 10px 6px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        tbody tr:hover { background: #f8f6ff; }

        .room-cell { font-weight: 600; color: #333; text-align: left; padding-left: 14px; white-space: nowrap; cursor: pointer; }
        .room-cell:hover { color: #667eea; text-decoration: underline; }

        .status-cell { font-weight: 600; font-size: 0.82rem; border-radius: 5px; padding: 5px 4px; display: inline-block; min-width: 36px; }
        .status-free { background: #e8f5e9; color: #2e7d32; }
        .status-busy { background: #fff3e0; color: #e65100; cursor: help; }

        .btn {
            padding: 8px 20px; border: none; border-radius: 8px; font-size: 0.88rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-secondary:hover { background: #e0e0e0; }

        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .popup-overlay.show { display: flex; }
        .popup-content { background: white; border-radius: 14px; padding: 24px; max-width: 650px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
        .popup-header h2 { font-size: 1.15rem; color: #333; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; line-height: 1; }
        .popup-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .popup-table th { background: #f5f0ff; color: #666; padding: 8px; text-align: left; }
        .popup-table td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
        .free-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .free-chip { background: #e8f5e9; color: #2e7d32; padding: 3px 10px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.4rem; }
            .filter-row { flex-direction: column; gap: 10px; }
            table { font-size: 0.78rem; min-width: 600px; }
            thead th { padding: 8px 4px; }
            tbody td { padding: 8px 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>空教室查询平台</h1>
            <p>上传任意课表压缩包，自动解析生成空教室查询</p>
        </div>

        <!-- Upload Section -->
        <div class="card" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-title">拖拽文件到此处，或点击选择文件</div>
                <div class="upload-hint">支持上传 ZIP 压缩包、单个 .xls/.xlsx 文件，或拖入整个文件夹</div>
                <div class="upload-formats">
                    <span class="format-tag">.zip</span>
                    <span class="format-tag">.xls</span>
                    <span class="format-tag">.xlsx</span>
                </div>
            </div>
            <input type="file" id="fileInput" multiple accept=".zip,.xls,.xlsx" style="display:none">
            <p style="text-align:center;margin-top:10px;font-size:0.8rem;color:#999;">
                RAR 文件请先解压，再上传解压后的 .xls 文件或打包为 ZIP
            </p>
        </div>

        <!-- Processing Section -->
        <div class="card" id="processingSection" style="display:none">
            <div class="processing">
                <div class="spinner"></div>
                <div class="process-status" id="processStatus">准备解析...</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
                </div>
            </div>
        </div>

        <!-- Query Section -->
        <div id="querySection" style="display:none">
            <div class="card">
                <div class="data-summary" id="dataSummary"></div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label>教学楼</label>
                        <select id="buildingSelect"></select>
                    </div>
                    <div class="filter-group">
                        <label>周次</label>
                        <div class="week-btns" id="weekBtns"></div>
                    </div>
                    <div class="filter-group">
                        <label>星期</label>
                        <div class="day-btns" id="dayBtns"></div>
                    </div>
                    <div class="filter-group" style="margin-left:auto;">
                        <label>&nbsp;</label>
                        <button class="btn btn-secondary" onclick="resetAll()">重新上传</button>
                    </div>
                </div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot dot-free"></span>空闲</div>
                    <div class="legend-item"><span class="legend-dot dot-busy"></span>有课</div>
                </div>
            </div>

            <div class="card">
                <div class="stats" id="statsBar"></div>
                <div class="table-wrapper">
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Room Detail Popup -->
    <div class="popup-overlay" id="roomPopup">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-btn" onclick="closePopup()">&times;</button>
            </div>
            <div id="popupBody"></div>
        </div>
    </div>

    <script>
        // ============ Global State ============
        let allEntries = [];
        let buildings = {};
        let occupied = {};
        let maxWeek = 0;
        let maxSection = 5;
        let availableDays = [];
        let currentWeek = 1;
        let currentDay = 1;
        let currentBuilding = '';

        const dayNames = {1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',7:'周日'};
        const sectionNames = {1:'第1大节',2:'第2大节',3:'第3大节',4:'第4大节',5:'第5大节',6:'第6大节'};
        const sectionTimes = {1:'1-2节',2:'3-4节',3:'5-6节',4:'7-8节',5:'9-10节',6:'11-12节'};

        // ============ File Handling ============
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => handleFileList(e.target.files));

        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', async e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            await handleDrop(e.dataTransfer);
        });

        async function handleDrop(dataTransfer) {
            const items = dataTransfer.items;
            const files = [];
            if (items && items.length > 0 && items[0].webkitGetAsEntry) {
                const entries = [];
                for (const item of items) {
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry();
                        if (entry) entries.push(entry);
                    }
                }
                await collectFilesFromEntries(entries, files);
            } else {
                for (const f of dataTransfer.files) files.push(f);
            }
            if (files.length > 0) await processFiles(files);
        }

        function collectFilesFromEntries(entries, files) {
            return Promise.all(entries.map(entry => {
                return new Promise(resolve => {
                    if (entry.isDirectory) {
                        const reader = entry.createReader();
                        const readBatch = () => {
                            reader.readEntries(async batch => {
                                if (batch.length === 0) { resolve(); return; }
                                await collectFilesFromEntries(batch, files);
                                readBatch();
                            });
                        };
                        readBatch();
                    } else if (entry.isFile) {
                        entry.file(f => {
                            if (f.name.match(/\.(xls|xlsx)$/i)) files.push(f);
                            resolve();
                        });
                    } else { resolve(); }
                });
            }));
        }

        async function handleFileList(fileList) {
            const files = Array.from(fileList).filter(f => f.name.match(/\.(zip|xls|xlsx)$/i));
            if (files.length > 0) await processFiles(files);
        }

        // ============ File Processing ============
        async function processFiles(files) {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('processingSection').style.display = '';
            document.getElementById('querySection').style.display = 'none';

            allEntries = [];
            const xlsFiles = [];

            for (const f of files) {
                if (f.name.match(/\.zip$/i)) {
                    try {
                        const zip = await JSZip.loadAsync(f);
                        const zipEntries = Object.values(zip.files);
                        const xlsInZip = zipEntries.filter(e => !e.dir && e.name.match(/\.(xls|xlsx)$/i));
                        for (let i = 0; i < xlsInZip.length; i++) {
                            const entry = xlsInZip[i];
                            updateStatus(`解压 ZIP: ${entry.name} (${i+1}/${xlsInZip.length})`);
                            try {
                                const ab = await entry.async('arraybuffer');
                                xlsFiles.push({ name: entry.name.split('/').pop(), content: ab });
                            } catch(e) { console.warn('Failed to read', entry.name, e); }
                        }
                    } catch(e) {
                        alert('ZIP 解压失败: ' + e.message);
                    }
                } else if (f.name.match(/\.(xls|xlsx)$/i)) {
                    const ab = await f.arrayBuffer();
                    xlsFiles.push({ name: f.name, content: ab });
                }
            }

            const total = xlsFiles.length;
            for (let i = 0; i < total; i++) {
                updateStatus(`解析课表: ${xlsFiles[i].name} (${i+1}/${total})`);
                document.getElementById('progressBar').style.width = ((i+1)/total*100) + '%';
                try {
                    const wb = XLSX.read(xlsFiles[i].content, { type: 'array' });
                    parseWorkbook(wb);
                } catch(e) {
                    console.warn('Failed to parse', xlsFiles[i].name, e);
                }
            }

            updateStatus('构建查询数据...');
            buildDataStructures();

            if (allEntries.length === 0) {
                alert('未找到有效的课表数据，请检查文件格式。');
                resetAll();
                return;
            }

            document.getElementById('processingSection').style.display = 'none';
            document.getElementById('querySection').style.display = '';
            initQuery();
        }

        function updateStatus(msg) {
            document.getElementById('processStatus').textContent = msg;
        }

        // ============ Excel Parsing ============
        function parseWorkbook(wb) {
            const sheetName = wb.SheetNames[0];
            if (!sheetName) return;
            const ws = wb.Sheets[sheetName];
            if (!ws) return;
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            parseScheduleRows(rows);
        }

        function parseScheduleRows(rows) {
            if (!rows || rows.length < 3) return;

            let headerRowIdx = -1;
            let dayColMap = {};

            for (let r = 0; r < Math.min(rows.length, 10); r++) {
                const row = rows[r];
                let found = false;
                for (let c = 0; c < row.length; c++) {
                    const val = String(row[c]).trim();
                    for (let d = 1; d <= 7; d++) {
                        if (val === dayNames[d] || val === '星期' + ['一','二','三','四','五','六','日'][d-1]) {
                            dayColMap[d] = c;
                            found = true;
                        }
                    }
                }
                if (found) { headerRowIdx = r; break; }
            }

            if (headerRowIdx === -1) return;

            const dataRows = [];
            for (let r = headerRowIdx + 1; r < rows.length; r++) {
                const row = rows[r];
                const col0 = String(row[0] || '').trim();
                if (col0 === '其他课程' || col0 === '注' || col0.startsWith('注') || col0.startsWith('备注') || col0 === '') continue;
                if (col0 === '上午' || col0 === '下午' || col0 === '晚上') {
                    dataRows.push(r);
                    if (dataRows.length >= 6) break;
                }
            }

            const days = Object.keys(dayColMap).map(Number);

            for (const r of dataRows) {
                if (r >= rows.length) continue;
                const row = rows[r];
                const sectionIdx = dataRows.indexOf(r) + 1;

                for (const d of days) {
                    const c = dayColMap[d];
                    if (c === undefined || c >= row.length) continue;
                    const cellText = String(row[c] || '').trim();
                    if (!cellText) continue;

                    const entries = parseCell(cellText, sectionIdx, d);
                    for (const e of entries) {
                        if (e.location) allEntries.push(e);
                    }
                }
            }

            // Also parse "其他课程" rows
            for (let r = headerRowIdx + 1; r < rows.length; r++) {
                const row = rows[r];
                if (!row || row.length === 0) continue;
                const col0 = String(row[0] || '').trim();
                if (col0.startsWith('其他课程')) {
                    for (let c = 1; c < row.length; c++) {
                        const cellText = String(row[c] || '').trim();
                        if (!cellText) continue;
                        const entries = parseCell(cellText, 0, 0);
                        for (const e of entries) {
                            if (e.location) allEntries.push(e);
                        }
                    }
                    break;
                }
            }
        }

        function parseCell(text, sectionIdx, day) {
            const results = [];
            const lines = text.split(/\n/);

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                const parts = line.split('/').map(s => s.trim());

                if (parts.length >= 3) {
                    const coursePart = parts[0];
                    const sectionWeekPart = parts[1];
                    const locationPart = parts.slice(2, parts.length - 1).join('/').trim() || parts[2];
                    const teacherPart = parts.length > 3 ? parts[parts.length - 1].trim() : '';

                    const secMatch = sectionWeekPart.match(/\((\d+)-(\d+)节\)/);
                    const weekMatch = sectionWeekPart.match(/(\d[\d,\-]*)周/);

                    let sections = [];
                    if (secMatch) {
                        const s1 = parseInt(secMatch[1]);
                        const s2 = parseInt(secMatch[2]);
                        for (let s = s1; s <= s2; s += 2) sections.push(Math.floor((s + 1) / 2));
                    } else if (sectionIdx > 0) {
                        sections = [sectionIdx];
                    }

                    let weeks = [];
                    if (weekMatch) {
                        weeks = parseWeeks(weekMatch[1]);
                    }

                    let location = locationPart;
                    if (location && location.length > 0) {
                        results.push({
                            course: coursePart,
                            weeks: weeks,
                            location: location,
                            teacher: teacherPart,
                            sections: sections.length > 0 ? sections : [sectionIdx],
                            day: day,
                            raw: line
                        });
                    }
                }
            }
            return results;
        }

        function parseWeeks(weekStr) {
            const weeks = [];
            const parts = weekStr.split(',');
            for (const part of parts) {
                const p = part.trim();
                const rangeMatch = p.match(/(\d+)-(\d+)/);
                if (rangeMatch) {
                    const start = parseInt(rangeMatch[1]);
                    const end = parseInt(rangeMatch[2]);
                    for (let w = start; w <= end; w++) weeks.push(w);
                } else {
                    const singleMatch = p.match(/(\d+)/);
                    if (singleMatch) weeks.push(parseInt(singleMatch[1]));
                }
            }
            return weeks;
        }

        // ============ Data Structure Building ============
        function buildDataStructures() {
            buildings = {};
            occupied = {};
            maxWeek = 0;
            availableDays = [];

            for (const entry of allEntries) {
                if (entry.location.includes('未排地点')) continue;

                const bldg = extractBuilding(entry.location);

                if (!buildings[bldg]) buildings[bldg] = { building: bldg, rooms: new Set() };
                buildings[bldg].rooms.add(entry.location);

                if (entry.day > 0 && !availableDays.includes(entry.day)) availableDays.push(entry.day);

                for (const w of entry.weeks) {
                    if (w > maxWeek) maxWeek = w;
                    if (!occupied[entry.location]) occupied[entry.location] = {};
                    if (!occupied[entry.location][w]) occupied[entry.location][w] = {};
                    if (!occupied[entry.location][w][entry.day]) occupied[entry.location][w][entry.day] = {};
                    for (const s of entry.sections) {
                        if (s > maxSection) maxSection = s;
                        if (!occupied[entry.location][w][entry.day][s]) {
                            occupied[entry.location][w][entry.day][s] = { course: entry.course, teacher: entry.teacher };
                        }
                    }
                }
            }

            availableDays.sort();
            if (maxWeek === 0) maxWeek = 20;
        }

        function extractBuilding(location) {
            const rest = location.replace(/^(南校区|北校区|东校区|西校区)\s*/, '');
            const m = rest.match(/([\u4e00-\u9fa5]+?(?:楼|馆|湖|中心|大楼|操场|平房|实训基地|实验室|实训室))/);
            if (m) return m[1];
            const parts = rest.split(/\s+/);
            return parts[0] || '未知';
        }

        function getRooms(buildingKey) {
            const b = buildings[buildingKey];
            if (!b) return [];
            return Array.from(b.rooms).sort();
        }

        function isBusy(room, week, day, section) {
            return occupied[room] && occupied[room][week] && occupied[room][week][day] && occupied[room][week][day][section];
        }

        function getBusyInfo(room, week, day, section) {
            if (isBusy(room, week, day, section)) return occupied[room][week][day][section];
            return null;
        }

        function shortRoomName(room) {
            return room.replace(/^(南校区|北校区|东校区|西校区)\s*/, '');
        }

        // ============ Query UI ============
        function initQuery() {
            const buildingSelect = document.getElementById('buildingSelect');
            buildingSelect.innerHTML = '';

            const sortedKeys = Object.keys(buildings).sort((a, b) => {
                return buildings[b].rooms.size - buildings[a].rooms.size;
            });

            for (const k of sortedKeys) {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k + ' (' + buildings[k].rooms.size + '间)';
                buildingSelect.appendChild(opt);
            }

            if (sortedKeys.length > 0) currentBuilding = sortedKeys[0];
            buildingSelect.onchange = () => { currentBuilding = buildingSelect.value; render(); };

            const weekBtns = document.getElementById('weekBtns');
            weekBtns.innerHTML = '';
            for (let w = 1; w <= maxWeek; w++) {
                const btn = document.createElement('button');
                btn.className = 'week-btn' + (w === 1 ? ' active' : '');
                btn.textContent = w;
                btn.onclick = () => { currentWeek = w; updateActiveWeek(); render(); };
                weekBtns.appendChild(btn);
            }

            const dayBtns = document.getElementById('dayBtns');
            dayBtns.innerHTML = '';
            for (const d of availableDays) {
                const btn = document.createElement('button');
                btn.className = 'day-btn' + (d === availableDays[0] ? ' active' : '');
                btn.textContent = dayNames[d];
                btn.onclick = () => { currentDay = d; updateActiveDay(); render(); };
                dayBtns.appendChild(btn);
            }
            if (availableDays.length > 0) currentDay = availableDays[0];

            const totalRooms = Object.keys(occupied).length;
            document.getElementById('dataSummary').innerHTML =
                '<div class="summary-item">解析记录 <b>' + countFiles() + '</b> 条</div>' +
                '<div class="summary-item">教学楼 <b>' + sortedKeys.length + '</b> 栋</div>' +
                '<div class="summary-item">教室 <b>' + totalRooms + '</b> 间</div>' +
                '<div class="summary-item">总周数 <b>' + maxWeek + '</b></div>';

            render();
        }

        function countFiles() {
            return allEntries.length;
        }

        function updateActiveWeek() {
            document.querySelectorAll('.week-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === currentWeek);
            });
        }

        function updateActiveDay() {
            const btns = document.querySelectorAll('.day-btn');
            availableDays.forEach((d, i) => {
                if (btns[i]) btns[i].classList.toggle('active', d === currentDay);
            });
        }

        function render() {
            renderStats();
            renderTable();
        }

        function renderStats() {
            const rooms = getRooms(currentBuilding);
            let freeCount = 0;
            for (const room of rooms) {
                let allFree = true;
                for (let s = 1; s <= maxSection; s++) {
                    if (isBusy(room, currentWeek, currentDay, s)) { allFree = false; break; }
                }
                if (allFree) freeCount++;
            }
            const label = currentBuilding;
            document.getElementById('statsBar').innerHTML =
                '<b>' + label + '</b> · 第 <b>' + currentWeek + ' 周</b> · <b>' + dayNames[currentDay] +
                '</b> &nbsp;|&nbsp; 完全空闲：<span class="badge badge-free">' + freeCount + ' 间</span> / 共 ' + rooms.length + ' 间';
        }

        function renderTable() {
            const head = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            head.innerHTML = '';
            body.innerHTML = '';

            let headHtml = '<tr><th>教室</th>';
            for (let s = 1; s <= maxSection; s++) {
                headHtml += '<th>第' + s + '大节<span class="section-sub">' + sectionTimes[s] + '</span></th>';
            }
            headHtml += '<th>空闲</th></tr>';
            head.innerHTML = headHtml;

            const rooms = getRooms(currentBuilding);
            for (const room of rooms) {
                const tr = document.createElement('tr');
                const safeRoom = room.replace(/'/g, "\\'");
                let rowHtml = '<td class="room-cell" onclick="showRoomDetail(\'' + safeRoom + '\')">' + shortRoomName(room) + '</td>';

                let freeCount = 0;
                for (let s = 1; s <= maxSection; s++) {
                    const info = getBusyInfo(room, currentWeek, currentDay, s);
                    if (info) {
                        rowHtml += '<td><span class="status-cell status-busy" title="' + escapeHtml(info.course) + ' / ' + escapeHtml(info.teacher) + '">有课</span></td>';
                    } else {
                        rowHtml += '<td><span class="status-cell status-free">空闲</span></td>';
                        freeCount++;
                    }
                }

                const badgeClass = freeCount === maxSection ? 'badge-free' : (freeCount === 0 ? 'badge-busy' : 'badge-free');
                rowHtml += '<td><span class="badge ' + badgeClass + '">' + freeCount + '/' + maxSection + '</span></td>';
                tr.innerHTML = rowHtml;
                body.appendChild(tr);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showRoomDetail(room) {
            document.getElementById('popupTitle').textContent = shortRoomName(room);

            const body = document.getElementById('popupBody');
            let html = '<p style="color:#888;margin-bottom:12px;">第' + currentWeek + '周 · ' + dayNames[currentDay] + ' 完整安排</p>';

            let hasAny = false;
            html += '<table class="popup-table"><thead><tr><th>节次</th><th>时间</th><th>课程</th><th>教师</th></tr></thead><tbody>';
            for (let s = 1; s <= maxSection; s++) {
                const info = getBusyInfo(room, currentWeek, currentDay, s);
                if (info) {
                    hasAny = true;
                    html += '<tr><td>第' + s + '大节</td><td>' + sectionTimes[s] + '</td><td>' + escapeHtml(info.course) + '</td><td>' + escapeHtml(info.teacher) + '</td></tr>';
                }
            }
            html += '</tbody></table>';

            if (!hasAny) {
                html = '<p style="color:#4caf50;font-size:1.05rem;text-align:center;padding:24px 0;">第' + currentWeek + '周 ' + dayNames[currentDay] + ' 该教室完全空闲</p>';
            }

            let freeSections = [];
            for (let s = 1; s <= maxSection; s++) {
                if (!isBusy(room, currentWeek, currentDay, s)) freeSections.push('第' + s + '大节(' + sectionTimes[s] + ')');
            }
            if (freeSections.length > 0 && freeSections.length < maxSection) {
                html += '<div style="margin-top:10px;"><b style="font-size:0.85rem;color:#555;">空闲时段：</b><div class="free-chips">';
                for (const fs of freeSections) html += '<span class="free-chip">' + fs + '</span>';
                html += '</div></div>';
            }

            body.innerHTML = html;
            document.getElementById('roomPopup').classList.add('show');
        }

        function closePopup() { document.getElementById('roomPopup').classList.remove('show'); }

        document.getElementById('roomPopup').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });

        function resetAll() {
            allEntries = [];
            buildings = {};
            occupied = {};
            maxWeek = 0;
            document.getElementById('uploadSection').style.display = '';
            document.getElementById('processingSection').style.display = 'none';
            document.getElementById('querySection').style.display = 'none';
            fileInput.value = '';
        }
    </script>
</body>
</html>
