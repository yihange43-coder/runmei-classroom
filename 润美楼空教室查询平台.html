<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>润美楼空教室查询平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; color: white; margin-bottom: 24px; }
        .header h1 { font-size: 2rem; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.2); margin-bottom: 6px; }
        .header p { font-size: 0.9rem; opacity: 0.85; }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            margin-bottom: 16px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.8rem; font-weight: 600; color: #666; }

        .week-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .week-btn {
            width: 36px; height: 32px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            background: white; font-size: 0.82rem; cursor: pointer;
            transition: all 0.15s; color: #555;
        }
        .week-btn:hover { border-color: #667eea; }
        .week-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-color: transparent;
        }

        .day-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .day-btn {
            padding: 8px 18px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            background: white; font-size: 0.88rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; color: #555;
        }
        .day-btn:hover { border-color: #667eea; }
        .day-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-color: transparent;
        }

        .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #666; }
        .legend-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
        .dot-free { background: #4caf50; }
        .dot-busy { background: #ff7043; }

        .stats { font-size: 0.9rem; color: #555; margin-bottom: 14px; }
        .badge {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 0.82rem; font-weight: 600;
        }
        .badge-free { background: #e8f5e9; color: #2e7d32; }
        .badge-busy { background: #fff3e0; color: #e65100; }

        .table-wrapper { overflow-x: auto; border-radius: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }

        thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 14px 10px; text-align: center;
            font-weight: 600; position: sticky; top: 0; z-index: 10;
        }
        thead th:first-child { border-top-left-radius: 8px; text-align: left; padding-left: 16px; }
        thead th:last-child { border-top-right-radius: 8px; }

        .section-sub { font-size: 0.72rem; font-weight: 400; opacity: 0.8; display: block; }

        tbody td {
            padding: 12px 8px; text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        tbody tr:hover { background: #f8f6ff; }

        .room-cell {
            font-weight: 600; color: #333; text-align: left;
            padding-left: 16px; white-space: nowrap; cursor: pointer;
        }
        .room-cell:hover { color: #667eea; text-decoration: underline; }

        .status-cell {
            font-weight: 600; font-size: 0.85rem;
            border-radius: 6px; padding: 6px 4px;
        }
        .status-free { background: #e8f5e9; color: #2e7d32; }
        .status-busy { background: #fff3e0; color: #e65100; }

        .room-detail-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .room-detail-popup.show { display: flex; }

        .popup-content {
            background: white; border-radius: 14px; padding: 24px;
            max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .popup-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0;
        }
        .popup-header h2 { font-size: 1.2rem; color: #333; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; line-height: 1; }

        .popup-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .popup-table th { background: #f5f0ff; color: #666; padding: 8px; text-align: left; }
        .popup-table td { padding: 8px; border-bottom: 1px solid #f0f0f0; }

        .free-list { margin-top: 12px; }
        .free-list h3 { font-size: 0.95rem; color: #333; margin-bottom: 8px; }
        .free-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .free-chip {
            background: #e8f5e9; color: #2e7d32;
            padding: 4px 12px; border-radius: 12px;
            font-size: 0.82rem; font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .filter-row { flex-direction: column; gap: 12px; }
            table { font-size: 0.8rem; }
            thead th { padding: 8px 4px; }
            tbody td { padding: 8px 4px; }
        }
    </style>
</head>

            let html = '<p style="color:#888;margin-bottom:14px;">第' + currentWeek + '周 · ' + dayNames[currentDay] + ' 课程安排</p>';

            let hasAny = false;
            html += '<table class="popup-table"><thead><tr><th>节次</th><th>时间</th><th>课程</th><th>教师</th></tr></thead><tbody>';

            for (let s = 1; s <= DATA.maxSection; s++) {
                const info = getBusyInfo(room, currentWeek, currentDay, s);
                if (info) {
                    hasAny = true;
                    html += '<tr><td>' + sectionNames[s] + '</td><td>' + sectionTimes[s] + '</td><td>' + info.course + '</td><td>' + info.teacher + '</td></tr>';
                }
            }
            html += '</tbody></table>';

            if (!hasAny) {
                html = '<p style="color:#4caf50;font-size:1.1rem;text-align:center;padding:30px 0;">第' + currentWeek + '周 ' + dayNames[currentDay] + ' 该教室完全空闲</p>';
            }

            // Also show free sections list
            let freeSections = [];
            for (let s = 1; s <= DATA.maxSection; s++) {
                if (!isBusy(room, currentWeek, currentDay, s)) freeSections.push(sectionNames[s] + '(' + sectionTimes[s] + ')');
            }
            if (freeSections.length > 0 && freeSections.length < DATA.maxSection) {
                html += '<div class="free-list"><h3>空闲时段：</h3><div class="free-chips">';
                for (const fs of freeSections) {
                    html += '<span class="free-chip">' + fs + '</span>';
                }
                html += '</div></div>';
            }

            body.innerHTML = html;
            document.getElementById('roomPopup').classList.add('show');
        }

        function closePopup() {
            document.getElementById('roomPopup').classList.remove('show');
        }

        document.getElementById('roomPopup').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });

        init();
    </script>
</body>
</html>
